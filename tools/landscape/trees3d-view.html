<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body style="margin:0;background:#000"><script type="module">
// Shows each near 3D tree (trees3d.bytes) at both levels of detail beside its impostor, lit alike, so the two can be
// compared before the game cross-fades one into the other. Used by trees3d-view.js.
import * as THREE from 'three';

const KINDS = ['oak', 'beech', 'birch', 'pine_a', 'pine_b', 'spruce_a', 'spruce_b', 'bush'];
// Left in sRGB: the shaders decode it, as preview.html's do.
const tex = async u => {
  const t = await new THREE.TextureLoader().loadAsync(u);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
};

function parse(buf) {
  const dv = new DataView(buf);
  let o = 4;
  const i32 = () => { const v = dv.getInt32(o, true); o += 4; return v; };
  const f32 = n => { const a = new Float32Array(buf.slice(o, o + n * 4)); o += n * 4; return a; };
  const ints = n => { const a = new Int32Array(buf.slice(o, o + n * 4)); o += n * 4; return a; };
  i32();
  const kinds = i32(), lods = i32(), layers = i32();
  const out = [];
  for (let k = 0; k < kinds; k++) {
    const row = [];
    for (let l = 0; l < lods; l++) {
      const nv = i32(), nb = i32(), nl = i32(), colour = Array.from(f32(3));
      row.push({ colour, P: f32(nv * 3), N: f32(nv * 3), U: f32(nv * 2), X: f32(nv * 3), B: ints(nb), L: ints(nl) });
    }
    out.push(row);
  }
  return { kinds: out, layers };
}

// Lit as the preview lights the land: sky and ground ambient, sun with a little wrap.
const lightGlsl = `
  uniform vec3 sun, sunColour, sky, ground;
  vec3 light(vec3 albedo, vec3 n) {
    vec3 amb = mix(ground, sky, n.y * 0.5 + 0.5);
    return albedo * (amb + sunColour * (max(dot(n, sun), 0.0) * 0.8 + 0.2));
  }`;
const uniforms = () => ({
  sun: { value: new THREE.Vector3(...(window.SUN || [0.4, 0.75, 0.5])).normalize() }, sunColour: { value: new THREE.Vector3(1.0, 0.9, 0.78).multiplyScalar(1.15) },
  sky: { value: new THREE.Vector3(0.42, 0.55, 0.75) }, ground: { value: new THREE.Vector3(0.16, 0.16, 0.11) },
});

function treeMesh(lod, barkArray, leafTex, tint0) {
  const tint = tint0.clone().multiply(new THREE.Vector3(...lod.colour));
  // Back into three.js's frame: z turned round, and the winding with it.
  const P = Float32Array.from(lod.P), N = Float32Array.from(lod.N);
  for (let i = 2; i < P.length; i += 3) { P[i] = -P[i]; N[i] = -N[i]; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(P, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(N, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(lod.U, 2));
  g.setAttribute('extra', new THREE.BufferAttribute(lod.X, 3));
  const idx = [];
  for (let i = 0; i < lod.B.length; i += 3) idx.push(lod.B[i], lod.B[i + 2], lod.B[i + 1]);
  const nb = idx.length;
  for (const i of lod.L) idx.push(i);
  g.setIndex(idx);
  g.addGroup(0, nb, 0);
  g.addGroup(nb, lod.L.length, 1);
  const vert = `
    attribute vec3 extra; varying vec2 vUv; varying vec3 vN; varying vec3 vX; varying vec3 vV;
    void main() { vUv = uv; vN = normal; vX = extra; vec4 w = modelMatrix * vec4(position, 1.0); vV = cameraPosition - w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
  const bark = new THREE.ShaderMaterial({ uniforms: { ...uniforms(), layers: { value: barkArray }, tint: { value: tint } }, glslVersion: THREE.GLSL3, side: THREE.DoubleSide,
    vertexShader: vert.replace(/varying/g, 'out').replace('attribute', 'in'),
    fragmentShader: `precision highp sampler2DArray; uniform sampler2DArray layers; in vec2 vUv; in vec3 vN; in vec3 vX; in vec3 vV; out vec4 o; ${lightGlsl}
      uniform vec3 tint; void main() { vec3 c = pow(texture(layers, vec3(vUv, vX.x)).rgb, vec3(2.2)) * vX.y * tint; o = vec4(pow(light(c, normalize(vN)), vec3(1.0 / 2.2)), 1.0); }` });
  const leaves = new THREE.ShaderMaterial({ uniforms: { ...uniforms(), map: { value: leafTex }, tint: { value: tint } }, side: THREE.DoubleSide,
    vertexShader: vert,
    fragmentShader: `uniform sampler2D map; uniform vec3 tint; varying vec2 vUv; varying vec3 vN; varying vec3 vX; varying vec3 vV; ${lightGlsl}
      void main() { vec4 c = texture2D(map, vUv); if (c.a < 0.5) discard;
        vec3 a = pow(c.rgb, vec3(2.2)) * tint * vX.y; gl_FragColor = vec4(pow(light(a, normalize(0.7 * normalize(vN) + 0.3 * normalize(vV))), vec3(1.0 / 2.2)), 1.0); }` });
  return new THREE.Mesh(g, [bark, leaves]);
}

// The impostor, as the game draws it: the nearest baked frame to the view, on a quad facing the camera.
function impostor(colour, normals, radius, centreAbove, tint) {
  const g = new THREE.PlaneGeometry(2, 2);
  return new THREE.Mesh(g, new THREE.ShaderMaterial({
    uniforms: { ...uniforms(), colour: { value: colour }, normals: { value: normals }, radius: { value: radius }, above: { value: centreAbove }, tint: { value: tint } },
    side: THREE.DoubleSide,
    vertexShader: `
      uniform float radius, above; varying vec2 vUv; varying vec3 vR; varying vec3 vU; varying vec3 vD;
      void main() {
        vec3 base = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
        vec3 centre = base + vec3(0.0, above, 0.0);
        vec3 local = cameraPosition - centre; local.y = max(local.y, 0.0);
        vec3 d = local / (abs(local.x) + abs(local.y) + abs(local.z));
        vec2 f = clamp(floor((vec2(d.x + d.z, d.x - d.z) * 0.5 + 0.5) * 7.0 + 0.5), 0.0, 7.0);
        vec2 gg = f / 7.0 * 2.0 - 1.0;
        float px = (gg.x + gg.y) * 0.5, pz = (gg.x - gg.y) * 0.5;
        vec3 D = normalize(vec3(px, max(1.0 - abs(px) - abs(pz), 0.0), pz));
        vec3 up = abs(D.y) > 0.999 ? vec3(0.0, 0.0, -1.0) : vec3(0.0, 1.0, 0.0);
        vec3 R = normalize(cross(up, D)), U = cross(D, R);
        vec3 w = centre + (position.x * R + position.y * U) * radius;
        vUv = (f + position.xy * 0.5 + 0.5) / 8.0; vR = R; vU = U; vD = D;
        gl_Position = projectionMatrix * viewMatrix * vec4(w, 1.0);
      }`,
    fragmentShader: `uniform sampler2D colour, normals; uniform vec3 tint; varying vec2 vUv; varying vec3 vR; varying vec3 vU; varying vec3 vD; ${lightGlsl}
      void main() { vec4 c = texture2D(colour, vUv); if (c.a < 0.5) discard;
        vec3 t = texture2D(normals, vUv).xyz * 2.0 - 1.0; vec3 n = normalize(t.x * vR + t.y * vU + t.z * vD);
        gl_FragColor = vec4(pow(light(pow(c.rgb, vec3(2.2)) * tint, n), vec3(1.0 / 2.2)), 1.0); }`,
  }));
}

/** Renders one tree, LOD0, LOD1 and impostor side by side, from a view height (0 level, 1 from above). Returns a PNG data URL. */
window.render = async (kind, radius, centreAbove, tint, w, h, lift, distance) => {
  if (!window.data) window.data = parse(await (await fetch('/trees3d/trees3d.bytes')).arrayBuffer());
  if (!window.bark) {
    const imgs = [];
    for (let i = 0; i < window.data.layers; i++) imgs.push(await tex(`/trees3d/bark_${String(i).padStart(2, '0')}.jpg`));
    const S = 512, px = new Uint8Array(S * S * 4 * imgs.length);
    const c = document.createElement('canvas'); c.width = c.height = S;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.setTransform(1, 0, 0, -1, 0, S);   // rows bottom first, as Unity reads them
    imgs.forEach((t, i) => { ctx.drawImage(t.image, 0, 0, S, S); px.set(ctx.getImageData(0, 0, S, S).data, i * S * S * 4); });
    const arr = new THREE.DataArrayTexture(px, S, S, imgs.length);
    arr.wrapS = arr.wrapT = THREE.RepeatWrapping; arr.minFilter = THREE.LinearMipmapLinearFilter; arr.magFilter = THREE.LinearFilter;
    arr.generateMipmaps = true; arr.needsUpdate = true;
    window.bark = arr;
  }
  const k = KINDS.indexOf(kind);
  const leafTex = await tex(`/trees3d/leaves_${kind}.png`);
  const colour = await tex(`/atlas/${kind}_colour.png`), normals = await tex(`/atlas/${kind}_normal.jpg`);
  for (const t of [colour, normals]) { t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; t.flipY = true; }
  const tv = new THREE.Vector3(...tint);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0.62, 0.72, 0.82);
  const gap = radius * 2.3;
  const items = [treeMesh(window.data.kinds[k][0], window.bark, leafTex, tv), treeMesh(window.data.kinds[k][1], window.bark, leafTex, tv), impostor(colour, normals, radius, centreAbove, tv)];
  items.forEach((m, i) => { m.position.x = (i - 1) * gap; scene.add(m); });
  const cam = new THREE.PerspectiveCamera(30, w / h, 0.5, 2000);
  const d = distance || gap * 2.2;
  cam.position.set(0, centreAbove + d * lift, d);
  cam.lookAt(0, centreAbove, 0);
  const r = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
  r.setSize(w, h);
  r.render(scene, cam);
  const url = r.domElement.toDataURL('image/png');
  // Each third's mean colour over the tree, linear: LOD0, LOD1, impostor. No antialiasing, so no edge pixel is part sky.
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(r.domElement, 0, 0);
  const px = ctx.getImageData(0, 0, w, h).data, bg = [px[0], px[1], px[2]];
  const means = [0, 1, 2].map(() => [0, 0, 0, 0]);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (Math.abs(px[i] - bg[0]) + Math.abs(px[i + 1] - bg[1]) + Math.abs(px[i + 2] - bg[2]) <= 40) continue;
      const m = means[Math.min(2, Math.floor(x / (w / 3)))];
      for (let k = 0; k < 3; k++) m[k] += Math.pow(px[i + k] / 255, 2.2);
      m[3]++;
    }
  r.dispose();
  return { url, means: means.map(m => [m[0] / m[3], m[1] / m[3], m[2] / m[3], m[3]]) };
};
window.ready = true;
</script></body></html>
