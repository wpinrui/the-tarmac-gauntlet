<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body style="margin:0;background:#000"><script type="module">
// Draws the landscape that tools/landscape/check wrote for a look, with the circuit's ground and road,
// so looks can be compared without Unity. Unity's frame (x east, y up, z north, left-handed) is
// mirrored into three.js by z -> -z. Trees are drawn with the same hemi-octahedral impostors as the game.
import * as THREE from 'three';

const KINDS = ['oak', 'beech', 'birch', 'pine_a', 'pine_b', 'spruce_a', 'spruce_b', 'bush'];
const bin = async u => new Uint8Array(await (await fetch(u)).arrayBuffer());
const json = async u => (await fetch(u)).json();

// ---- the sky at an hour, as SkyClock does it
function sunDir(hour) {
  const h = (hour - 13.6) * 15 * Math.PI / 180, phi = 50 * Math.PI / 180, dec = 23.44 * Math.PI / 180;
  const east = -Math.cos(dec) * Math.sin(h);
  const north = Math.sin(dec) * Math.cos(phi) - Math.cos(dec) * Math.cos(h) * Math.sin(phi);
  const up = Math.sin(dec) * Math.sin(phi) + Math.cos(dec) * Math.cos(h) * Math.cos(phi);
  return new THREE.Vector3(east, up, -north);   // mirrored into three's frame
}

const vert = `
  uniform float radius, centreAbove, frames;
  attribute vec4 a; attribute vec4 b; attribute vec3 tint;   // base.xyz, scale; squash, yaw; leaf tint
  varying vec2 vUv; varying vec3 vR; varying vec3 vU; varying vec3 vD; varying vec3 vTint; varying float vFog;
  vec3 rotY(vec3 v, float t) { float c = cos(t), s = sin(t); return vec3(c * v.x + s * v.z, v.y, -s * v.x + c * v.z); }
  void main() {
    float scale = a.w, squash = b.x, yaw = b.y;
    vec3 centre = a.xyz + vec3(0.0, centreAbove * scale * squash, 0.0);
    vec3 local = rotY(cameraPosition - centre, -yaw);
    local.y = max(local.y, 0.0);
    vec3 d = local / (abs(local.x) + abs(local.y) + abs(local.z));
    vec2 f = clamp(floor((vec2(d.x + d.z, d.x - d.z) * 0.5 + 0.5) * (frames - 1.0) + 0.5), 0.0, frames - 1.0);
    vec2 g = f / (frames - 1.0) * 2.0 - 1.0;
    float px = (g.x + g.y) * 0.5, pz = (g.x - g.y) * 0.5;
    vec3 D = normalize(vec3(px, max(1.0 - abs(px) - abs(pz), 0.0), pz));
    vec3 up = abs(D.y) > 0.999 ? vec3(0.0, 0.0, -1.0) : vec3(0.0, 1.0, 0.0);
    vec3 R = normalize(cross(up, D)), U = cross(D, R);
    vec3 off = (position.x * R + position.y * U) * radius * scale;
    off.y *= squash;
    vec3 w = centre + rotY(off, yaw);
    vUv = (f + position.xy * 0.5 + 0.5) / frames;
    vR = rotY(R, yaw); vU = rotY(U, yaw); vD = rotY(D, yaw);
    vTint = tint;
    vec4 view = viewMatrix * vec4(w, 1.0);
    vFog = -view.z;
    gl_Position = projectionMatrix * view;
  }`;
const frag = `
  uniform sampler2D colour, normals; uniform vec3 sun, sunColour, sky, ground, fogColour; uniform vec2 fogRange;
  varying vec2 vUv; varying vec3 vR; varying vec3 vU; varying vec3 vD; varying vec3 vTint; varying float vFog;
  void main() {
    vec4 c = texture2D(colour, vUv);
    // Unity keeps the leaves' coverage in the smaller mipmaps; three.js does not, so far trees would
    // thin out here. Raise alpha with the mip level instead.
    vec2 px = vUv * 2048.0;
    float mip = max(0.0, 0.5 * log2(max(dot(dFdx(px), dFdx(px)), dot(dFdy(px), dFdy(px)))));
    if (c.a * (1.0 + mip * 0.3) < 0.5) discard;
    vec3 t = texture2D(normals, vUv).xyz * 2.0 - 1.0;
    vec3 n = normalize(t.x * vR + t.y * vU + t.z * vD);
    vec3 albedo = pow(c.rgb, vec3(2.2)) * vTint;
    vec3 amb = mix(ground, sky, n.y * 0.5 + 0.5);
    vec3 lit = albedo * (amb + sunColour * (max(dot(n, sun), 0.0) * 0.8 + 0.2));
    float fog = clamp((vFog - fogRange.x) / (fogRange.y - fogRange.x), 0.0, 1.0);
    gl_FragColor = vec4(pow(mix(lit, fogColour, fog), vec3(1.0 / 2.2)), 1.0);
  }`;

window.build = async (look, hour) => {
  const circuit = await json('/circuit.json');
  const plan = await json(`/plan/${look}/plan.json`);
  const t = circuit.terrain;
  const lin = c => new THREE.Color(c[0], c[1], c[2]);
  const scene = new THREE.Scene();
  const L = sunDir(hour).normalize();
  const sunColour = new THREE.Color(1.0, 0.9, 0.78).multiplyScalar(1.15);
  const sky = new THREE.Color(0.42, 0.55, 0.75), groundAmb = new THREE.Color(0.16, 0.16, 0.11);
  const fogColour = new THREE.Color(0.70, 0.80, 0.90).convertSRGBToLinear();
  scene.background = fogColour.clone();
  scene.fog = new THREE.Fog(fogColour.clone(), 1400, 7000);

  // Ground: heights, with the fields' colours and the mowing stripes as Ground.shader draws them.
  const heights = new Uint8Array(atob(t.heightsCm).split('').map(ch => ch.charCodeAt(0)));
  const H = (x, z) => t.baseHeight + (heights[2 * (z * t.countX + x)] | (heights[2 * (z * t.countX + x) + 1] << 8)) / 100;
  const colours = plan.ground.map(c => lin(c).convertSRGBToLinear());
  const fieldsRgb = await bin(`/plan/${look}/fields.bin`), fieldsTex = new Uint8Array(plan.mapX * plan.mapZ * 4);
  for (let i = 0; i < plan.mapX * plan.mapZ; i++) fieldsTex.set([fieldsRgb[3 * i], fieldsRgb[3 * i + 1], fieldsRgb[3 * i + 2], 255], 4 * i);
  const fields = new THREE.DataTexture(fieldsTex, plan.mapX, plan.mapZ);
  const mowing = new THREE.DataTexture(new Float32Array((await bin(`/plan/${look}/mowing.bin`)).buffer), plan.mapX, plan.mapZ, THREE.RGBAFormat, THREE.FloatType);
  fields.colorSpace = THREE.SRGBColorSpace;
  for (const tx of [fields, mowing]) { tx.magFilter = THREE.LinearFilter; tx.minFilter = THREE.LinearFilter; tx.needsUpdate = true; }
  const pos = [];
  const nx = t.countX, nz = t.countZ, idx = [];
  for (let z = 0; z < nz; z++) for (let x = 0; x < nx; x++) pos.push(t.originX + x * t.spacing, H(x, z), -(t.originZ + z * t.spacing));
  for (let z = 0; z < nz - 1; z++)
    for (let x = 0; x < nx - 1; x++) { const i = z * nx + x; idx.push(i, i + 1, i + nx, i + 1, i + nx + 1, i + nx); }
  const gg = new THREE.BufferGeometry();
  gg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  gg.setIndex(idx); gg.computeVertexNormals();
  const cell = t.spacing / 2;
  const groundMat = new THREE.ShaderMaterial({ side: THREE.DoubleSide, extensions: { derivatives: true }, uniforms: {
      fields: { value: fields }, mowing: { value: mowing }, stripes: { value: window.stripes === false ? 0 : 1 },
      map: { value: new THREE.Vector4(t.originX - cell / 2, t.originZ - cell / 2, 1 / (plan.mapX * cell), 1 / (plan.mapZ * cell)) },
      sun: { value: L }, sunColour: { value: new THREE.Vector3(sunColour.r, sunColour.g, sunColour.b) }, sky: { value: new THREE.Vector3(sky.r, sky.g, sky.b) },
      groundAmb: { value: new THREE.Vector3(groundAmb.r, groundAmb.g, groundAmb.b) },
      fogColour: { value: new THREE.Vector3(fogColour.r, fogColour.g, fogColour.b) }, fogRange: { value: new THREE.Vector2(1400, 7000) } },
    vertexShader: `
      varying vec3 vW; varying vec3 vN; varying float vFog;
      void main() { vW = position; vN = normal; vec4 v = viewMatrix * vec4(position, 1.0); vFog = -v.z; gl_Position = projectionMatrix * v; }`,
    fragmentShader: `
      uniform sampler2D fields, mowing; uniform vec4 map; uniform float stripes; uniform vec3 sun, sunColour, sky, groundAmb, fogColour; uniform vec2 fogRange;
      varying vec3 vW; varying vec3 vN; varying float vFog;
      void main() {
        vec2 xz = vec2(vW.x, -vW.z);   // back into Unity's frame
        vec2 uv = (xz - map.xy) * map.zw;
        vec3 albedo = texture2D(fields, uv).rgb;   // decoded from sRGB already
        vec4 mow = texture2D(mowing, uv);
        float d = mow.r / 5.0, across = fwidth(d);
        float wave = clamp((abs(fract(d * 0.5) - 0.5) * 4.0 - 1.0) / max(across * 2.0, 0.08), -1.0, 1.0);
        float fade = clamp(mow.g, 0.0, 1.0) * clamp(1.5 - across * 2.5, 0.0, 1.0);
        vec2 along = mow.ba / max(length(mow.ba), 1e-3);
        vec2 view = xz - vec2(cameraPosition.x, -cameraPosition.z);
        float lean = dot(view, along) / max(length(view), 1e-3);
        albedo *= 1.0 + stripes * 0.11 * wave * fade * (0.35 + 0.65 * lean);
        vec3 n = normalize(vN);
        vec3 lit = albedo / 3.14159 * (mix(groundAmb, sky, n.y * 0.5 + 0.5) * 2.4 + sunColour * 2.6 * max(dot(n, sun), 0.0));
        float fog = clamp((vFog - fogRange.x) / (fogRange.y - fogRange.x), 0.0, 1.0);
        gl_FragColor = vec4(pow(mix(lit, fogColour, fog), vec3(1.0 / 2.2)), 1.0);
      }` });
  scene.add(new THREE.Mesh(gg, groundMat));

  // Road: a ribbon a little above the ground.
  const cen = circuit.centre, w = circuit.width, nC = cen.length / 3;
  const rp = [], ri = [];
  for (let k = 0; k <= nC; k++) {
    const i = k % nC, a = (i + nC - 1) % nC, b2 = (i + 1) % nC;
    const tx = cen[3 * b2] - cen[3 * a], tz = cen[3 * b2 + 2] - cen[3 * a + 2], l = Math.hypot(tx, tz);
    const lx = -tz / l, lz = tx / l, h = w[i] / 2 + 1.6;
    rp.push(cen[3 * i] + lx * h, cen[3 * i + 1] + 0.1, -(cen[3 * i + 2] + lz * h), cen[3 * i] - lx * h, cen[3 * i + 1] + 0.1, -(cen[3 * i + 2] - lz * h));
    if (k < nC) { const j = 2 * k; ri.push(j, j + 1, j + 2, j + 1, j + 3, j + 2); }
  }
  const rg = new THREE.BufferGeometry();
  rg.setAttribute('position', new THREE.Float32BufferAttribute(rp, 3)); rg.setIndex(ri); rg.computeVertexNormals();
  scene.add(new THREE.Mesh(rg, new THREE.MeshLambertMaterial({ color: 0x2b2b2d, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -4 })));

  // Horizon ring.
  const ring = new DataView((await bin(`/plan/${look}/ring.bin`)).buffer);
  const nv = ring.getInt32(0, true), nt = ring.getInt32(4, true);
  let o = 8; const hp = [], hu = [], hi = [];
  for (let i = 0; i < nv; i++, o += 12) hp.push(ring.getFloat32(o, true), ring.getFloat32(o + 4, true), -ring.getFloat32(o + 8, true));
  for (let i = 0; i < nv; i++, o += 8) hu.push(ring.getFloat32(o, true), ring.getFloat32(o + 4, true));
  for (let i = 0; i < nt; i++, o += 4) hi.push(ring.getInt32(o, true));
  const rm = await bin(`/plan/${look}/ringmap.bin`);
  const tex = new Uint8Array(rm.length * 4);
  for (let i = 0; i < rm.length; i++) { const cc = colours[rm[i]].clone().convertLinearToSRGB(); const n = 0.9 + 0.2 * Math.random(); tex.set([cc.r * 255 * n, cc.g * 255 * n, cc.b * 255 * n, 255], i * 4); }
  const ringTex = new THREE.DataTexture(tex, plan.ringAround, plan.ringOut); ringTex.colorSpace = THREE.SRGBColorSpace; ringTex.needsUpdate = true;
  ringTex.magFilter = THREE.LinearFilter; ringTex.minFilter = THREE.LinearMipmapLinearFilter; ringTex.generateMipmaps = true;
  const hg = new THREE.BufferGeometry();
  hg.setAttribute('position', new THREE.Float32BufferAttribute(hp, 3)); hg.setAttribute('uv', new THREE.Float32BufferAttribute(hu, 2));
  hg.setIndex(hi); hg.computeVertexNormals();
  scene.add(new THREE.Mesh(hg, new THREE.MeshLambertMaterial({ map: ringTex, side: THREE.DoubleSide })));

  scene.add(new THREE.HemisphereLight(sky, groundAmb, 2.4));
  const dl = new THREE.DirectionalLight(sunColour, 2.6); dl.position.copy(L); scene.add(dl);

  // Trees by kind.
  const trees = new Float32Array((await bin(`/plan/${look}/trees.bin`)).buffer);
  const loader = new THREE.TextureLoader();
  for (let k = 0; k < KINDS.length; k++) {
    const meta = await json(`/atlas/${KINDS[k]}.json`);
    const A = [], B = [], T = [];
    for (let i = 0; i < trees.length; i += 10) {
      if (trees[i + 6] !== k) continue;
      A.push(trees[i], trees[i + 1], -trees[i + 2], trees[i + 3]);
      B.push(trees[i + 4], -trees[i + 5], 0, 0);
      T.push(trees[i + 7], trees[i + 8], trees[i + 9]);
    }
    if (!A.length) continue;
    const geo = new THREE.InstancedBufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 1, -1, 0, 1, 1, 0, -1, 1, 0], 3));
    geo.setIndex([0, 1, 2, 0, 2, 3]);
    geo.setAttribute('a', new THREE.InstancedBufferAttribute(new Float32Array(A), 4));
    geo.setAttribute('b', new THREE.InstancedBufferAttribute(new Float32Array(B), 4));
    geo.setAttribute('tint', new THREE.InstancedBufferAttribute(new Float32Array(T), 3));
    geo.instanceCount = A.length / 4;
    const colour = await loader.loadAsync(`/atlas/${KINDS[k]}_colour.png`), normals = await loader.loadAsync(`/atlas/${KINDS[k]}_normal.jpg`);
    for (const tx of [colour, normals]) { tx.flipY = true; tx.anisotropy = 8; }
    const mat = new THREE.ShaderMaterial({ vertexShader: vert, fragmentShader: frag, side: THREE.DoubleSide, uniforms: {
      radius: { value: meta.radius }, centreAbove: { value: meta.centreAbove }, frames: { value: meta.frames },
      colour: { value: colour }, normals: { value: normals }, sun: { value: L }, sunColour: { value: new THREE.Vector3(sunColour.r, sunColour.g, sunColour.b).multiplyScalar(0.9) },
      sky: { value: new THREE.Vector3(sky.r, sky.g, sky.b).multiplyScalar(0.9) }, ground: { value: new THREE.Vector3(0.12, 0.12, 0.08) },
      fogColour: { value: new THREE.Vector3(fogColour.r, fogColour.g, fogColour.b) }, fogRange: { value: new THREE.Vector2(1400, 7000) } } });
    const mesh = new THREE.Mesh(geo, mat); mesh.frustumCulled = false; scene.add(mesh);
  }
  window.scene = scene; window.circuit = circuit;
  return true;
};

/** A camera from Unity-frame position and target, field of view in degrees. */
window.shoot = (p, q, fov, w, h) => {
  const r = window.renderer || (window.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }));
  r.setSize(w, h); r.outputColorSpace = THREE.SRGBColorSpace;
  if (!r.domElement.parentNode) document.body.appendChild(r.domElement);
  const cam = new THREE.PerspectiveCamera(fov, w / h, 0.5, 9000);
  cam.position.set(p[0], p[1], -p[2]); cam.lookAt(q[0], q[1], -q[2]);
  r.render(window.scene, cam);
  return r.domElement.toDataURL('image/jpeg', 0.9);
};
window.ready = true;
</script></body></html>
